plugins {
    id 'base'
    alias(libs.plugins.fabric.loom) apply false
    alias(libs.plugins.protobuf) apply false
}

allprojects {
    group = 'dev.kizuna.meridian.healing'
    version = '0.1.0'
}

subprojects {
    apply plugin: 'java-library'
    repositories { mavenCentral() }
    java { toolchain { languageVersion = JavaLanguageVersion.of(libs.versions.java.get()) } }
    base.archivesName = "${rootProject.name}-${project.name}"
    tasks.withType(JavaCompile).configureEach {
        options.release = libs.versions.java.get().toInteger()
        options.encoding = 'UTF-8'
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.files('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'))
    }
}

tasks.named('assemble') { dependsOn ':server:assemble', ':fabric:assemble' }
tasks.named('check') { dependsOn ':server:check', ':fabric:check' }
tasks.named('clean') { dependsOn ':server:clean', ':fabric:clean' }
