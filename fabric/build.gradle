plugins { id 'net.fabricmc.fabric-loom' }

repositories { maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api
    implementation 'dev.kizuna.meridian.vanilla:fabric'
    implementation project(':server')
    include project(':server')
    include implementation('local.meridian:server')
    // 版本目录条目是 Provider，implementation 不返回依赖对象，嵌套声明单独写。
    implementation libs.protobuf.java
    include libs.protobuf.java
    implementation libs.tomlj
    include libs.tomlj
    implementation libs.antlr.runtime
    include libs.antlr.runtime
}

processResources {
    inputs.property 'version', project.version
    def preserveJsonEscapes = true
    inputs.property 'preserveJsonEscapes', preserveJsonEscapes
    filesMatching('fabric.mod.json') {
        expand([version: project.version]) { escapeBackslash = preserveJsonEscapes }
    }
}

apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')

loom {
    mods { meridian_vanilla_healing { sourceSet sourceSets.main } }
    runs { server { runDir 'build/server' } }
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
dependencies {
    // 饥饿与和平回血只在服务端玩家上执行；假玩家夹具来自功法库的 testFixtures，经 Damage 组合的功法源码解析。
    gametestImplementation testFixtures('dev.kizuna.meridian.technique:fabric')
    // 伤势用例走伤害附属的指定部位入口，它的返回类型在伤害附属的 server 模块里。
    gametestImplementation 'dev.kizuna.meridian.vanilla:server'
}
def gametestDirectory = providers.gradleProperty('gametestRunDir').getOrElse('build/gametest')
def configuredGametestDirectory = providers.gradleProperty('configuredGametestRunDir')
        .getOrElse('build/gametest-configured')
loom {
    mods { meridian_healing_test { sourceSet sourceSets.gametest } }
    runs {
        gametest {
            server()
            name 'Healing GameTest'
            source sourceSets.gametest
            runDir gametestDirectory
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
        gametestConfigured {
            server()
            name 'Healing Configured GameTest'
            source sourceSets.gametest
            runDir configuredGametestDirectory
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-configured-results.xml'
        }
    }
}

tasks.named('runGametest') {
    doFirst {
        // 每局从空目录新建世界：GameTest 服务端按自带的平坦预设建世界，旧目录只会累积上一局的区块、实体、假玩家与模组存档。
        // 26.2 把生成设置与游戏规则拆到了 data/minecraft，只留 level.dat 会退回随机种子的默认地形，所以整个目录删掉。
        file("${gametestDirectory}/world").deleteDir()
    }
}

// 独立运行目录验证非默认配置，不改正式配置，也不提供产品级测试旁路。
tasks.named('runGametestConfigured') {
    doFirst {
        // 与默认配置的 GameTest 一样每局新建世界。
        file("${configuredGametestDirectory}/world").deleteDir()
        def configuration = file("${configuredGametestDirectory}/config/meridian-vanilla-healing.toml")
        configuration.parentFile.mkdirs()
        configuration.text = '''absorption_distribution = "per_part"
health_boost_changes_part_limits = true
totem_enabled = false
respect_peaceful_difficulty = false
respect_natural_regeneration = false
'''
    }
}
