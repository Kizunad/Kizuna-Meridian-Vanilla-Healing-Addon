plugins { id 'fabric-loom' }

repositories { maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    modImplementation 'dev.kizuna.meridian.vanilla:fabric'
    implementation project(':server')
    include project(':server')
    include implementation('local.meridian:server')
    // 版本目录条目是 Provider，implementation 不返回依赖对象，嵌套声明单独写。
    implementation libs.protobuf.java
    include libs.protobuf.java
    implementation libs.tomlj
    include libs.tomlj
    implementation libs.antlr.runtime
    include libs.antlr.runtime
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')

loom {
    mods { meridian_vanilla_healing { sourceSet sourceSets.main } }
    runs { server { runDir 'build/server' } }
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods { meridian_healing_test { sourceSet sourceSets.gametest } }
    runs {
        gametest {
            server()
            name 'Healing GameTest'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
        gametestConfigured {
            server()
            name 'Healing Configured GameTest'
            source sourceSets.gametest
            runDir 'build/gametest-configured'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-configured-results.xml'
        }
    }
}

// 独立运行目录验证非默认配置，不改正式配置，也不提供产品级测试旁路。
tasks.named('runGametestConfigured') {
    doFirst {
        def configuration = file('build/gametest-configured/config/meridian-vanilla-healing.toml')
        configuration.parentFile.mkdirs()
        configuration.text = '''absorption_distribution = "per_part"
health_boost_changes_part_limits = true
totem_enabled = false
respect_peaceful_difficulty = false
respect_natural_regeneration = false
'''
    }
}
