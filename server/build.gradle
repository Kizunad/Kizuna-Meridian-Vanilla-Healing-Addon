plugins { id 'com.google.protobuf' }

dependencies {
    api 'local.meridian:server'
    implementation libs.tomlj
    testImplementation libs.junit4
}

sourceSets.main.proto.srcDir rootProject.file('shared/src/main/proto')
// protoc 与运行库同版本，取版本目录中的 protobuf-java。
protobuf { protoc { artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.java.get()}" } }
test { useJUnit() }
