syntax = "proto3";
package kizuna.meridian.healing.v1;
option java_package = "dev.kizuna.meridian.healing.pb";
option java_outer_classname = "HealingEffects";

// 只保存此附属授予的临时效果，不保存身体 HP 或基础上限。
message EffectState {
  string body_id = 1;
  repeated PartShield shields = 2;
  int32 absorption_level = 3; // 放大等级 +1，零表示没有效果。
  repeated PartShield health_boost_grants = 4; // amount 为本附属已授予的上限增量。
  repeated string injury_effects = 5; // 原版活动效果表中由伤势施加的实例。
  // 已停止投影；上限增量仍归封存的身体。即使为 false 也写出，以区分空归属清单与旧存档。
  optional bool detached = 6;
}
message PartShield {
  string part_id = 1;
  double amount = 2;
}
